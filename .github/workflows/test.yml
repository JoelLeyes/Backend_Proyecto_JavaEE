name: Java CI with Maven

on:
  pull_request:
    paths:
      - 'src/**'
      - 'deploy/**'
      - 'pom.xml'
      - 'Dockerfile'
      - '.github/workflows/test.yml'
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'deploy/**'
      - 'pom.xml'
      - 'Dockerfile'
      - '.github/workflows/test.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run backend tests
        run: mvn -B test --file pom.xml